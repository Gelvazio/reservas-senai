function parseCSV(t){const R=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);R.push(r);r=[];f=""}else f+=c}if(f!==""||r.length){r.push(f);R.push(r)}return R}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const HK=/^(DATA|Produto|CIDADE|Função|COLABORADOR)$/i;
function render(tabs){const m=document.getElementById("m");m.innerHTML="";for(const t of tabs){let rows=parseCSV(t.csv).filter(r=>r.some(c=>c.trim()));let w=0;rows.forEach(r=>{let k=r.length;while(k&&!r[k-1].trim())k--;w=Math.max(w,k)});
let cnt=0,h="";rows.forEach((r,i)=>{r=r.slice(0,w);const ne=r.filter(c=>c.trim());const isH=r.some(c=>HK.test(c.trim()));
if(ne.length<=2&&!isH&&w>2){h+=`<tr class="sec"><td colspan="${w}">${esc(ne.join(" · "))}</td></tr>`}else{if(!isH)cnt++;h+=`<tr class="${isH?"h":"d"}">${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`}});
const d=document.createElement("details");d.className="card";d.open=true;d.innerHTML=`<summary>${esc(t.name)}<span class="badge">${cnt}</span></summary><div class="body"><table>${h}</table></div>`;m.appendChild(d)}filter()}
function filter(){const q=document.getElementById("q").value.trim().toLowerCase();document.querySelectorAll("tr.d").forEach(tr=>tr.classList.toggle("hide",!!q&&!tr.textContent.toLowerCase().includes(q)));
document.querySelectorAll(".card").forEach(c=>{c.querySelector(".badge").textContent=c.querySelectorAll("tr.d:not(.hide)").length})}
async function load(){const st=document.getElementById("st");st.textContent="Atualizando…";try{const out=await Promise.all(SNAP.map(async t=>{let r;try{r=await fetch(`https://docs.google.com/spreadsheets/d/${ID}/export?format=csv&gid=${t.gid}`)}catch(e){r=await fetch(`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:csv&headers=0&gid=${t.gid}`)}if(!r.ok)throw 0;return{...t,csv:await r.text()}}));render(out);try{localStorage.setItem("reservas",JSON.stringify(out))}catch(e){}st.textContent="Dados ao vivo: "+new Date().toLocaleString("pt-BR")}
catch(e){st.textContent="Sem conexão com a planilha — exibindo cópia salva."}}
document.getElementById("q").oninput=filter;document.getElementById("r").onclick=load;
let c=null;try{c=JSON.parse(localStorage.getItem("reservas"))}catch(e){}render(c||SNAP);load();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");
